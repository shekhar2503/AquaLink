name: AquaLink CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and dataset validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: AquaLink/backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r AquaLink/backend/requirements-dev.txt
      - name: Validate canonical and fallback datasets
        run: python AquaLink/backend/scripts/validate_dataset.py --report "${RUNNER_TEMP}/aqualink-validation.json"
      - name: Run backend unit and integration tests
        working-directory: AquaLink/backend
        run: python -m pytest -q
      - name: Upload dataset validation report after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dataset-validation-report
          path: ${{ runner.temp }}/aqualink-validation.json
          if-no-files-found: ignore

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: aqualink-dashboard/package-lock.json
      - name: Install frontend dependencies
        working-directory: aqualink-dashboard
        run: npm ci
      - name: Run ESLint
        working-directory: aqualink-dashboard
        run: npm run lint
      - name: Run frontend contract and component tests
        working-directory: aqualink-dashboard
        run: npm test
      - name: Build production frontend
        working-directory: aqualink-dashboard
        run: npm run build

  end-to-end:
    name: Chromium end-to-end journeys
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: AquaLink/backend/requirements-dev.txt
      - name: Set up Node.js with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: aqualink-dashboard/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r AquaLink/backend/requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: aqualink-dashboard
        run: npm ci
      - name: Install Chromium runtime
        working-directory: aqualink-dashboard
        run: npx playwright install --with-deps chromium
      - name: Run browser journeys
        working-directory: aqualink-dashboard
        run: npm run test:e2e
      - name: Upload Playwright report after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: aqualink-dashboard/playwright-report
          if-no-files-found: ignore
          retention-days: 7
